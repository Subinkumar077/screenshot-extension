<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snapshot</title>
    <link rel="stylesheet" href="../assets/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img class="logo" src="../assets/icons/icon48.png" alt="" width="36" height="36" />
      <div class="titles">
        <h1>Snapshot</h1>
        <p>Capture the web, your way</p>
      </div>
    </header>

    <div id="notice" class="banner" role="status" hidden></div>

    <main id="view-actions" class="cards">
      <button type="button" class="card" id="btn-area">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8V5a1 1 0 0 1 1-1h3" />
            <path d="M16 4h3a1 1 0 0 1 1 1v3" />
            <path d="M20 16v3a1 1 0 0 1-1 1h-3" />
            <path d="M8 20H5a1 1 0 0 1-1-1v-3" />
            <circle cx="12" cy="12" r="2" />
          </svg>
        </span>
        <span class="card-body">
          <strong>Capture Area</strong>
          <small>Drag to select any part of the page</small>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6" /></svg>
        </span>
      </button>

      <button type="button" class="card" id="btn-full">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="3" width="12" height="18" rx="2" />
            <path d="M10 8h4" />
            <path d="M10 12h4" />
            <path d="M10 16h2" />
          </svg>
        </span>
        <span class="card-body">
          <strong>Capture Full Page</strong>
          <small>Scroll &amp; stitch the entire page</small>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6" /></svg>
        </span>
      </button>
    </main>

    <section id="view-progress" class="progress" hidden aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p id="progress-text" class="progress-text">Starting…</p>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
        <span id="progress-fill"></span>
      </div>
      <p class="progress-hint">Keep this tab open and visible until it finishes.</p>
      <button type="button" class="btn" id="btn-cancel">Cancel</button>
    </section>

    <footer class="foot">
      <span class="lock" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
      </span>
      Processed on your device. Nothing is uploaded.
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
